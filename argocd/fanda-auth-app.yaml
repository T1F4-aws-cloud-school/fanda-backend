apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanda-auth-app
  namespace: argocd
  labels:
    app: fanda-auth
    component: backend
spec:
  project: default
  source:
    repoURL: https://github.com/T1F4-aws-cloud-school/fanda-backend.git
    targetRevision: develop  # develop 브랜치
    path: auth/k8s           # auth/k8s/ 디렉터리 매니페스트 사용
  destination:
    server: https://kubernetes.default.svc
    namespace: fanda-be-auth    # 실제 네임스페이스로 수정
  syncPolicy:
    automated:
      prune: true        # 불필요한 리소스 자동 삭제
      selfHeal: true     # 자동 복구
    syncOptions:
      - CreateNamespace=true     # 네임스페이스 없으면 자동 생성
      - ApplyOutOfSyncOnly=true  # 변경된 리소스만 적용
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 헬스 체크 설정
  healthCheck:
    enabled: true