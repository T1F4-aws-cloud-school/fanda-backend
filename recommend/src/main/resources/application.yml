spring:
  config:
    import: application-secret.yml
  application:
    name: recommend
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/recommend_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8005

etl:
  base-url: ${ETL_BASE_URL:${etl.base-url:http://fanda-etl-service.fanda-be-etl.svc:5000}}
  connect-timeout-millis: 10000
  read-timeout-millis: 600000

personalize:
  s3:
    bucket: ${AWS_S3_BUCKET}
    base-prefix: personalize

management:
  tracing:
    sampling.probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_HTTP_ENDPOINT:http://otel-collector.fanda-monitoring.svc.cluster.local:4318/v1/traces}