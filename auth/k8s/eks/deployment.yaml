apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanda-auth-deploy
  namespace: fanda-be-auth
  labels:
    app: fanda-auth
    version: v1
    component: backend
    service: auth
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: fanda-auth
  template:
    metadata:
      labels:
        app: fanda-auth
        version: v1
        component: backend
        service: auth
    spec:
      containers:
        - name: fanda-auth
          # ECR 이미지 (Jenkins가 자동으로 업데이트)
          image: 746491138596.dkr.ecr.us-east-1.amazonaws.com/fanda-be/auth-service:8ae955fe
          imagePullPolicy: Always

          ports:
            - containerPort: 8002
              name: http
              protocol: TCP

          env:
            # Spring Boot 프로파일
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 타임존 설정
            - name: TZ
              value: "Asia/Seoul"

            # JVM 옵션
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom"

            # RDS MySQL 연결 정보
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://fanda-rds-instance.cetoqsmoe8u7.us-east-1.rds.amazonaws.com:3306/auth_db?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul"

            - name: DB_HOST
              value: "fanda-rds-instance.cetoqsmoe8u7.us-east-1.rds.amazonaws.com"

            # 데이터베이스 인증 정보
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: DB_ROOT_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: DB_ROOT_PASSWORD

            # ElastiCache Redis 연결 정보
            - name: REDIS_HOST
              value: "master.fanda-redis-cluster.l4acue.use1.cache.amazonaws.com"
            - name: REDIS_PORT
              value: "6379"

            # JWT 설정 (Secret에서 참조)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: JWT_SECRET

            # JPA 설정
            - name: JPA_DDL_AUTO
              value: "update"

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      dnsPolicy: ClusterFirst
      restartPolicy: Always

      # 보안 컨텍스트
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000