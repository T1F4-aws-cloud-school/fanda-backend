apiVersion: v1
kind: Service
metadata:
  name: fanda-auth-service
  namespace: fanda-be-auth
  labels:
    app: fanda-auth
    service: auth
spec:
  type: NodePort
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
      nodePort: 30081
  selector:
    app: fanda-auth