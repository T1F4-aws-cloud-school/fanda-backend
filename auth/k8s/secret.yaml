apiVersion: v1
kind: Secret
metadata:
  name: fanda-auth-secret
  namespace: fanda-be-auth
  labels:
    app: fanda-auth
    component: backend
    service: auth
type: Opaque
stringData:
  # MySQL root 계정 (root / rootpass)
  DB_ROOT_USERNAME: "root"
  DB_ROOT_PASSWORD: "rootpass"

  # MySQL fandauser 계정 (fandauser / fandapass)
  DB_USER_USERNAME: "fandauser"
  DB_USER_PASSWORD: "fandapass"

  # Redis 인증 정보 (root / fanda123!)
  REDIS_USERNAME: "root"
  REDIS_PASSWORD: "fanda123!"

  # JWT 시크릿 키
  JWT_SECRET: "fanda-jwt-secret-key-for-production-environment"