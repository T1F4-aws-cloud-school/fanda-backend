apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanda-auth-deploy
  namespace: fanda-be-auth
  labels:
    app: fanda-auth
    version: v1
    component: backend
    service: auth
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: fanda-auth
  template:
    metadata:
      labels:
        app: fanda-auth
        version: v1
        component: backend
        service: auth
    spec:
      containers:
        - name: fanda-auth
          # Jenkins가 자동으로 업데이트하는 이미지 태그
          image: 192.168.2.111/fanda-be/auth-service:60ca5ef2
          imagePullPolicy: Always

          ports:
            - containerPort: 8002
              name: http
              protocol: TCP

          env:
            # Spring Boot 프로파일
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 타임존 설정
            - name: TZ
              value: "Asia/Seoul"

            # JVM 옵션
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.fanda-db-ms.svc.cluster.local:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"

            # 데이터베이스 연결 정보
            - name: DB_HOST
              value: "mysql.fanda-db-ms.svc.cluster.local"

            # 데이터베이스 인증 정보 (Secret에서 참조) - ROOT 계정 사용
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: DB_ROOT_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: DB_ROOT_PASSWORD

            # Redis 연결 정보
            - name: REDIS_HOST
              value: "redis-master.fanda-redis.svc.cluster.local"

            - name: REDIS_PORT
              value: "6379"

            # Redis 인증 정보 (Secret에서 참조)
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: REDIS_USERNAME

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: REDIS_PASSWORD

            # JWT 설정 (Secret에서 참조)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fanda-auth-secret
                  key: JWT_SECRET

            # JPA 설정
            - name: JPA_DDL_AUTO
              value: "update"  # 처음 배포시 테이블 자동 생성

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          # 헬스체크 모두 제거 - Pod가 시작되면 바로 Ready 상태

      dnsPolicy: ClusterFirst
      restartPolicy: Always

      # 보안 컨텍스트
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000