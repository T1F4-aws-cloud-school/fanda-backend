# AWS EKS 환경용 설정
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # password 제거
      timeout: 60000ms
      ssl:
        enabled: true

management:
  tracing:
    sampling.probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_HTTP_ENDPOINT:http://otel-collector.fanda-monitoring.svc.cluster.local:4318/v1/traces}

aws:
  xray:
    enabled: true
    daemon-address: 127.0.0.1:2000
    tracing-name: auth-service
    context-missing: LOG_ERROR

logging:
  level:
    com.amazonaws.xray: DEBUG
    com.fanda: DEBUG