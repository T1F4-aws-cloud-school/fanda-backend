spring:
  config:
    import: application-secret.yml
  application:
    name: auth
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/auth_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  token:
    access-expiration-time: 900000
    refresh-expiration-time: 1209600000

server:
  port: 8002

# X-Ray 설정 추가
aws:
  xray:
    enabled: true
    daemon-address: 127.0.0.1:2000
    tracing-name: auth-service
    context-missing: LOG_ERROR

logging:
  level:
    com.amazonaws.xray: DEBUG
    com.fanda: DEBUG