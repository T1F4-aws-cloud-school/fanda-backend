spring:
  config:
    import: application-secret.yml
  application:
    name: auth
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/auth_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  token:
    access-expiration-time: 900000
    refresh-expiration-time: 1209600000

server:
  port: 8002

# 관리 및 트레이싱 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0

# 디버깅용 로깅 설정 (운영 시 조정 가능)
logging:
  level:
    io.opentelemetry: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    root: INFO