plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fanda'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2023.0.6")
}

sourceSets {
	main{
		resources{
			srcDir 'src/main/resources'
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation platform("software.amazon.awssdk:bom:2.25.4")
	implementation 'software.amazon.awssdk:bedrockruntime'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	// pdf
	implementation 'org.apache.pdfbox:pdfbox:2.0.30'
	// aws sdk for s3
	implementation platform('software.amazon.awssdk:bom:2.25.4')
	implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'commons-fileupload:commons-fileupload:1.6.0'
    implementation 'io.netty:netty-codec-http2:4.1.124.Final'

    implementation 'software.amazon.awssdk:sts'

	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	runtimeOnly  'io.opentelemetry:opentelemetry-exporter-otlp'

    // MSK IAM 인증을 위한 라이브러리 추가
    implementation 'software.amazon.msk:aws-msk-iam-auth:2.0.3'

}


dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('processResources') {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}