apiVersion: v1
kind: Secret
metadata:
  name: fanda-banner-secret
  namespace: fanda-be-marketing
  labels:
    app: fanda-banner
    component: backend
    service: banner
type: Opaque
stringData:
  # MySQL root 계정 (root / rootpass)
  DB_ROOT_USERNAME: "root"
  DB_ROOT_PASSWORD: "rootpass"

  # MySQL fandauser 계정 (fandauser / fandapass)
  DB_USER_USERNAME: "fandauser"
  DB_USER_PASSWORD: "fandapass"

  # AWS 자격증명 (S3, Bedrock 사용을 위해) - 배포 시 실제 값으로 교체 필요
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_ACCESS_KEY"
  AWS_SESSION_TOKEN: "YOUR_AWS_SESSION_TOKEN"
  AWS_REGION: "us-east-1"

  # Kafka 연결 정보
  KAFKA_BOOTSTRAP_SERVERS: "kafka.fanda-kafka.svc.cluster.local:9092"