apiVersion: v1
kind: Service
metadata:
  name: fanda-feedback-service
  namespace: fanda-be-feedback
  labels:
    app: fanda-feedback
    service: feedback
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      protocol: TCP
      name: http
  selector:
    app: fanda-feedback