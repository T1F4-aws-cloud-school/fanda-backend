apiVersion: v1
kind: Service
metadata:
  name: fanda-feedback-service
  namespace: fanda-be-marketing
  labels:
    app: fanda-feedback
    service: feedback
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.100
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
  selector:
    app: fanda-feedback