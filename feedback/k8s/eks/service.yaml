apiVersion: v1
kind: Service
metadata:
  name: fanda-feedback-service
  namespace: fanda-be-marketing
  labels:
    app: fanda-feedback
    service: feedback
spec:
  type: NodePort
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
      nodePort: 30082
  selector:
    app: fanda-feedback