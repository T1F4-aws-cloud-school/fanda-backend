spring:
  config:
    import: application-secret.yml
  application:
    name: feedback
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/feedback_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8003

# AWS 설정 (X-Ray 포함)
aws:
  region: ${AWS_REGION}
  xray:
    enabled: true
    daemon-address: 127.0.0.1:2000
    tracing-name: feedback-service
    context-missing: LOG_ERROR
  s3:
    bucket: ${AWS_S3_BUCKET}

management:
  tracing:
    sampling.probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_HTTP_ENDPOINT:http://otel-collector.fanda-monitoring.svc.cluster.local:4318/v1/traces}

logging:
  level:
    com.amazonaws.xray: DEBUG
    com.fanda: DEBUG