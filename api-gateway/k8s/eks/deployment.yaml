apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanda-gateway-deploy
  namespace: fanda-gateway
  labels:
    app: fanda-gateway
    version: v1
    component: gateway
    service: api-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: fanda-gateway
  template:
    metadata:
      labels:
        app: fanda-gateway
        version: v1
        component: gateway
        service: api-gateway
    spec:
      # OpenTelemetry Java Agent 다운로드
      initContainers:
        - name: otel-agent-download
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              curl -L -o /otel/opentelemetry-javaagent.jar \
              https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar
          volumeMounts:
            - name: otel-agent
              mountPath: /otel

      containers:
        - name: fanda-gateway
          # ECR 이미지 (Jenkins가 자동으로 업데이트)
          image: 746491138596.dkr.ecr.us-east-1.amazonaws.com/fanda-be/api-gateway:d2b93a6b
          imagePullPolicy: Always

          ports:
            - containerPort: 8001
              name: http
              protocol: TCP

          env:
            # Spring Boot 프로파일
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 타임존 설정
            - name: TZ
              value: "Asia/Seoul"

            # JVM 옵션
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -Djava.security.egd=file:/dev/./urandom"

            # OpenTelemetry Java Agent 설정 (수정됨)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"

            # DaemonSet을 위한 Host IP 기반 엔드포인트
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"

            # Host IP를 환경변수로 전달
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            # 추가 OpenTelemetry 설정
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=api-gateway,service.namespace=fanda-gateway"

            # 디버깅용 (운영 시 제거 가능)
            - name: OTEL_LOG_LEVEL
              value: "DEBUG"

            # JWT 설정 (Secret에서 참조)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fanda-gateway-secret
                  key: JWT_SECRET

            # AWS EKS 서비스 URL들 (클러스터 내부 DNS 사용)
            - name: AUTH_SERVICE_URL
              value: "http://fanda-auth-service.fanda-be-auth.svc.cluster.local:8002"

            - name: SHOP_SERVICE_URL
              value: "http://fanda-shop-service.fanda-be-shop.svc.cluster.local:8006"

            - name: FEEDBACK_SERVICE_URL
              value: "http://fanda-feedback-service.fanda-be-marketing.svc.cluster.local:8003"

            - name: BANNER_SERVICE_URL
              value: "http://fanda-banner-service.fanda-be-marketing.svc.cluster.local:8004"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          # Volume mount 추가
          volumeMounts:
            - name: otel-agent
              mountPath: /opt/otel

      # Volume 추가
      volumes:
        - name: otel-agent
          emptyDir: {}

      # 보안 컨텍스트
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000