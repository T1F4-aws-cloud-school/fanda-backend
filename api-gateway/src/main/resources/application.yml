spring:
  config:
    import: application-secret.yml
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: banner-reports
          uri: http://localhost:8004
          predicates:
            - Path=/banner/api/v1/reports/**
          filters:
            - StripPrefix=1
        - id: banner-others
          uri: http://localhost:8004
          predicates:
            - Path=/banner/api/v1/**
          filters:
            - StripPrefix=1
        - id: auth
          uri: http://localhost:8002
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: feedback-admin #관리자 경로
          uri: http://localhost:8003 #feedback 주로
          predicates:
            - Path=/feedback/api/v1/admin/** #feedback/admin으로 시작하는 경우
          filters:
            - StripPrefix=1 #admin/**으로 전달
        - id: feedback-others #그 외 공개 경로
          uri: http://localhost:8003 #같은 feedback 주소
          predicates:
            - Path=/feedback/api/v1/** #feedback/으로 시작하면
          filters:
            - StripPrefix=1
jwt:
  secret: ${JWT_SECRET} #auth와 같은 시크릿을 환경 변수로 주입

server:
  port: 8001