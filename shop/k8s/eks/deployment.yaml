apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanda-shop-deploy
  namespace: fanda-be-shop
  labels:
    app: fanda-shop
    version: v1
    component: backend
    service: shop
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: fanda-shop
  template:
    metadata:
      labels:
        app: fanda-shop
        version: v1
        component: backend
        service: shop
    spec:
      containers:
        - name: fanda-shop
          # ECR 이미지 (Jenkins가 자동으로 업데이트)
          image: 746491138596.dkr.ecr.us-east-1.amazonaws.com/fanda-be/shop-service:22bb0f34
          imagePullPolicy: Always

          ports:
            - containerPort: 8006
              name: http
              protocol: TCP

          env:
            # Spring Boot 프로파일
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 타임존 설정
            - name: TZ
              value: "Asia/Seoul"

            # JVM 옵션
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom"

            # RDS MySQL 연결 정보
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://fanda-rds-instance.cetoqsmoe8u7.us-east-1.rds.amazonaws.com:3306/shop_db?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul"

            - name: DB_HOST
              value: "fanda-rds-instance.cetoqsmoe8u7.us-east-1.rds.amazonaws.com"

            # 데이터베이스 인증 정보 (Secret에서 참조)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fanda-shop-secret
                  key: DB_ROOT_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fanda-shop-secret
                  key: DB_ROOT_PASSWORD

            # Auth Service 연결 (EKS 내 ClusterIP 서비스)
            - name: AUTH_SERVICE_URL
              value: "http://fanda-auth-service.fanda-be-auth.svc.cluster.local:8002"

            # X-Ray 설정 추가
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_XRAY_TRACING_NAME
              value: "shop-service"
            - name: AWS_XRAY_CONTEXT_MISSING
              value: "LOG_ERROR"
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "127.0.0.1:2000"

            # JPA 설정
            - name: JPA_DDL_AUTO
              value: "update"

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      dnsPolicy: ClusterFirst
      restartPolicy: Always

      # 보안 컨텍스트
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000